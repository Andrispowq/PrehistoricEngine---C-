name: Math tests

on:
  pull_request:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: math-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  math:
    name: Math / ${{ matrix.os }} / ${{ matrix.configuration }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ macos-14, windows-2022 ]
        configuration: [ Debug, Release ]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install pinned Premake
        run: python3 scripts/ci/install-premake.py
      - name: Generate build graph
        run: premake5 cmake
      - name: Configure macOS CPU tests
        if: runner.os == 'macOS'
        run: cmake -S . -B build/ci-math -G Ninja -DPREHISTORIC_TESTS_ONLY=ON -DCMAKE_BUILD_TYPE=${{ matrix.configuration }}
      - name: Configure Windows CPU tests
        if: runner.os == 'Windows'
        run: cmake -S . -B build/ci-math -G "Visual Studio 17 2022" -A x64 -DPREHISTORIC_TESTS_ONLY=ON
      - name: Build math tests
        run: cmake --build build/ci-math --config ${{ matrix.configuration }} --parallel 4
      - name: Run contracts
        run: ctest --test-dir build/ci-math -C ${{ matrix.configuration }} -L contract --output-on-failure --no-tests=error --output-junit contracts.xml
      - name: Track known defects separately
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        run: ctest --test-dir build/ci-math -C ${{ matrix.configuration }} -L known-defect --output-on-failure --no-tests=error --output-junit known-defects.xml
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: math-${{ matrix.os }}-${{ matrix.configuration }}
          path: |
            build/ci-math/*.xml
            build/ci-math/Testing/Temporary/*.log
            build/ci-math/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: warn
